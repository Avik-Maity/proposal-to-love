
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Something Special ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts" id="hearts"></div>

  <main class="card">
    <div class="big-heart">❤️</div>

    <p class="small-title">A LITTLE MESSAGE FOR YOU</p>
    <h1 id="heading">Hey, Someone Special! 💕</h1>

    <p id="message">
      Every moment feels more beautiful when you're around.
      I have something special to ask you...
    </p>

    <div id="proposal" class="proposal" hidden>
      <h2>Will you be mine? 💖</h2>
      <p>Will you make my world more beautiful?</p>
      <div class="buttons">
        <button id="yesBtn">Yes! ❤️</button>
        <button id="noBtn">No 🙈</button>
      </div>
    </div>

    <button id="continueBtn">Open My Heart 💌</button>
    <p class="footer">Made with ❤️ just for you</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
